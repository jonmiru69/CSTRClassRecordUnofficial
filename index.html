<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CST-R Digital Class Record — a focused academic workspace for managing classes, assessment scores, and quarterly grades.">
    <meta name="theme-color" content="#550b18">
    <title>CST-R Digital Class Record</title>
    <link rel="icon" type="image/png" href="ASSETS/cstr-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="ASSETS/styles.css?v=30">
    <link rel="stylesheet" href="ASSETS/workspace.css?v=30">
    <link rel="stylesheet" href="ASSETS/premium.css?v=30">
    <link rel="stylesheet" href="ASSETS/revisions.css?v=30">
  </head>
  <body>
    <div id="siteBg" aria-hidden="true"></div>
    <div id="app"></div>
    <script src="ASSETS/grading-engine.js?v=11"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.min.js"></script>
    <script src="ASSETS/vendor/pdf-lib.min.js"></script>
    <script src="ASSETS/vendor/docx.iife.js"></script>
    <script src="ASSETS/official-egradesheet.js?v=2"></script>
    <!-- Firebase compat SDK, self-hosted (see ASSETS/vendor/firebase-compat.bundle.js
         for what this is and how to rebuild it after a version bump). Used to
         load three separate files from www.gstatic.com; that's now a single
         same-origin file so login/claim/sign-up no longer break on networks
         where gstatic.com is slow, filtered, or unreachable. -->
    <script src="ASSETS/vendor/firebase-compat.bundle.js"></script>
    <script src="ASSETS/firebase-sync.js?v=25"></script>
    <script src="ASSETS/record-tools.js?v=25"></script>
    <script src="ASSETS/stable-dom.js?v=25"></script>
    <script src="ASSETS/registration.js?v=25"></script>
    <script src="ASSETS/app.js?v=29"></script>
    <script src="ASSETS/motion.js?v=25"></script>
    <script>
      (() => {
        const appRoot = document.querySelector("#app");
        if (!appRoot) return;

        const navigationIcon = (direction) => direction === "expand"
          ? '<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16M8 12h12M15 7l5 5-5 5"/></svg>'
          : '<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 4v16M16 12H4M9 7l-5 5 5 5"/></svg>';

        let enhancementQueued = false;

        function enhanceInterface() {
          enhancementQueued = false;
          const layout = document.querySelector(".app-layout");
          const sidebar = document.querySelector(".app-sidebar");

          if (layout && sidebar) {
            const brand = sidebar.querySelector(".sidebar-brand");
            const search = sidebar.querySelector(".sidebar-search-block");
            const toggle = sidebar.querySelector('[data-action="toggle-sidebar"]');

            if (brand && search && brand.nextElementSibling !== search) brand.after(search);
            if (search && toggle && search.nextElementSibling !== toggle) search.after(toggle);

            if (toggle) {
              const collapsed = layout.classList.contains("sidebar-collapsed");
              const direction = collapsed ? "expand" : "collapse";
              if (toggle.dataset.directionIcon !== direction) {
                toggle.innerHTML = navigationIcon(direction);
                toggle.dataset.directionIcon = direction;
              }
              const label = collapsed ? "Expand navigation" : "Collapse navigation";
              if (toggle.getAttribute("aria-label") !== label) toggle.setAttribute("aria-label", label);
              if (toggle.getAttribute("title") !== label) toggle.setAttribute("title", label);
            }
          }

          const header = document.querySelector(".app-header-inner");
          if (header) {
            let note = header.querySelector(".policy-note");
            if (!note) {
              note = document.createElement("p");
              note.className = "policy-note";
              note.setAttribute("role", "note");
              note.setAttribute("aria-label", "Grading system compliance");
              note.innerHTML = '<strong>DepEd grading compliance</strong><span>Order No. 15, s. 2026</span>';
            }
            const context = header.querySelector(".page-context");
            if (context && context.nextElementSibling !== note) context.after(note);
          }
        }

        const queueEnhancement = () => {
          if (enhancementQueued) return;
          enhancementQueued = true;
          requestAnimationFrame(enhanceInterface);
        };

        const observer = new MutationObserver(queueEnhancement);
        observer.observe(appRoot, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["class"]
        });
        enhanceInterface();
      })();
    </script>
  </body>
</html>
