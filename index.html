<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#550b18">
    <title>CST-R Digital Class Record</title>
    <link rel="icon" type="image/png" href="ASSETS/cstr-logo.png">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script src="ASSETS/vendor/firebase-compat.bundle.js"></script>
    <script src="ASSETS/firebase-sync.js?v=5"></script>
