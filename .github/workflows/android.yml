name: Android build and release
on:
  push:
    branches: [main, codex/android-mobile, codex/audit-corrections]
    paths-ignore: ['**/*.md', 'downloads/**', '.build-artifacts/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish_current: ${{ steps.freshness.outputs.current }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install locked build tools
        run: npm install --global pnpm@11.25.0 && pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify web and grading workflows
        run: pnpm test
      - name: Verify visual layouts with synthetic records
        run: pnpm test:visual
      - name: Verify Firebase ownership rules
        run: pnpm test:rules
      - name: Require canonical hosting credentials before production release
        if: github.ref == 'refs/heads/main'
        env:
          FIREBASE_DEPLOY_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CSTR_CLASS_RECORD_GLOBAL }}
        run: test -n "$FIREBASE_DEPLOY_ACCOUNT" || { echo 'Configure the canonical Firebase Hosting service account before releasing. Existing deployments remain unchanged.'; exit 1; }
      - name: Bundle client
        run: pnpm android:sync
      - name: Set release version
        run: |
          echo "CSTR_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "CSTR_VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Build review APK and unsigned release
        if: github.ref != 'refs/heads/main'
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug assembleRelease lintDebug --no-daemon
      - name: Retain review-only builds briefly
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: android-review-${{ github.run_number }}
          retention-days: 1
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/reports/lint-results-debug.html
      - name: Sign production release
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE: ${{ secrets.CSTR_ANDROID_KEYSTORE_BASE64 }}
          CSTR_STORE_PASSWORD: ${{ secrets.CSTR_ANDROID_STORE_PASSWORD }}
          CSTR_KEY_ALIAS: ${{ secrets.CSTR_ANDROID_KEY_ALIAS }}
          CSTR_KEY_PASSWORD: ${{ secrets.CSTR_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo 'Release signing is not configured. No unsigned app will be published.'; exit 1; }
          export CSTR_KEYSTORE_PATH="$RUNNER_TEMP/cstr-release.jks"
          printf '%s' "$KEYSTORE" | base64 --decode > "$CSTR_KEYSTORE_PATH"
          trap 'rm -f "$CSTR_KEYSTORE_PATH"' EXIT
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease lintRelease --no-daemon)
          export CSTR_AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          node tools/publish-release.mjs android/app/build/outputs/apk/release/app-release.apk "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" "$CSTR_VERSION_NAME" "$CSTR_VERSION_CODE"
      - name: Check source freshness before publication
        if: github.ref == 'refs/heads/main'
        id: freshness
        run: |
          current_head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current_head" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer source patch is queued. This older build will not be published.'
          fi
      - name: Commit verified APK and update feed
        if: github.ref == 'refs/heads/main' && steps.freshness.outputs.current == 'true'
        run: |
          git config user.name 'CSTR release'
          git config user.email 'cstr-release@users.noreply.github.com'
          git add downloads
          git commit -m "Release Android $CSTR_VERSION_NAME [skip ci]"
          git push origin HEAD:main
      - name: Package website and verified downloads together
        if: github.ref == 'refs/heads/main' && steps.freshness.outputs.current == 'true'
        run: node tools/build-web.mjs
      - name: Deploy canonical Firebase workspace
        if: github.ref == 'refs/heads/main' && steps.freshness.outputs.current == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CSTR_CLASS_RECORD_GLOBAL }}
          projectId: cstr-class-record-global
          channelId: live
      - name: Package Pages entry and Android downloads
        if: github.ref == 'refs/heads/main' && steps.freshness.outputs.current == 'true'
        run: pnpm build:pages
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && steps.freshness.outputs.current == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && steps.freshness.outputs.current == 'true'
        with: {path: pages-dist}
  deploy:
    if: github.ref == 'refs/heads/main' && needs.android.outputs.publish_current == 'true'
    needs: android
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website with matching download feed
        id: deployment
        uses: actions/deploy-pages@v4
